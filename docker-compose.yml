services:
  chroma:
    profiles: [master]
    image: chromadb/chroma:0.5.23
    ports:
      - "8002:8000"
    volumes:
      - chroma-data:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE
    restart: unless-stopped

  control:
    profiles: [master]
    build:
      context: ./control
      dockerfile: Dockerfile
    ports:
      - "80:80"
      - "8000:8000"   # Exposed so Prometheus can scrape /prometheus directly
    env_file: .env
    depends_on:
      - chroma
    restart: unless-stopped

  worker:
    profiles: [worker]
    build:
      context: ./worker
      dockerfile: Dockerfile
    network_mode: host
    environment:
      - WORKER_NAME=${WORKER_NAME:-gpu-worker-1}
      - WORKER_PORT=${WORKER_PORT:-8001}
      - WORKER_HOST=${WORKER_HOST}
      - COORDINATOR_URL=${COORDINATOR_URL}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://localhost:11434}
      - LLM_MODEL=${LLM_MODEL:-llama3.1:8b}
      - HEARTBEAT_INTERVAL_SECONDS=${HEARTBEAT_INTERVAL_SECONDS:-0.5}
      - METRICS_INTERVAL_SECONDS=${METRICS_INTERVAL_SECONDS:-1}
      - REGISTRATION_RETRY_SECONDS=${REGISTRATION_RETRY_SECONDS:-2}
      - LATENCY_WINDOW=${LATENCY_WINDOW:-20}
    restart: unless-stopped

  prometheus:
    profiles: [master]
    image: prom/prometheus:v2.54.1
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
    depends_on:
      - control
    restart: unless-stopped

  grafana:
    profiles: [master]
    image: grafana/grafana:11.3.1
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  chroma-data:
  grafana-data:
