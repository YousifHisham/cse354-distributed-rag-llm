# ── Shared worker template ────────────────────────────────────
x-worker: &worker
  profiles: [workers]
  build:
    context: ./worker
    dockerfile: Dockerfile
  depends_on:
    control:
      condition: service_healthy
  restart: unless-stopped
  networks:
    - llmnet

x-worker-env: &worker-env
  WORKER_PORT: "8001"
  COORDINATOR_URL: http://control:8000
  LLM_MODEL: ${LLM_MODEL:-llama3.1:8b}
  OLLAMA_SSL_VERIFY: "false"
  HEARTBEAT_INTERVAL_SECONDS: "0.5"
  METRICS_INTERVAL_SECONDS: "1"
  REGISTRATION_RETRY_SECONDS: "2"
  LATENCY_WINDOW: "20"

services:

  # ── Master ────────────────────────────────────────────────────
  chroma:
    profiles: [master]
    image: chromadb/chroma:0.5.23
    ports:
      - "8002:8000"
    volumes:
      - chroma-data:/chroma/chroma
    environment:
      IS_PERSISTENT: "TRUE"
      ANONYMIZED_TELEMETRY: "FALSE"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/heartbeat"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - llmnet

  control:
    profiles: [master]
    build:
      context: ./control
      dockerfile: Dockerfile
    ports:
      - "80:80"
      - "8000:8000"
    env_file: .env
    depends_on:
      chroma:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - llmnet

  prometheus:
    profiles: [master]
    image: prom/prometheus:v2.54.1
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
    depends_on:
      control:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - llmnet

  grafana:
    profiles: [master]
    image: grafana/grafana:11.3.1
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - llmnet

  # ── Workers (Mac containers → Thunder Compute Ollama) ─────────
  worker-1:
    <<: *worker
    ports:
      - "9001:8001"
    environment:
      <<: *worker-env
      WORKER_NAME: worker-1
      WORKER_HOST: worker-1
      OLLAMA_BASE_URL: ${THUNDER_COMPUTE_URL_1:-http://host.docker.internal:11434}

  worker-2:
    <<: *worker
    ports:
      - "9002:8001"
    environment:
      <<: *worker-env
      WORKER_NAME: worker-2
      WORKER_HOST: worker-2
      OLLAMA_BASE_URL: ${THUNDER_COMPUTE_URL_2:-http://host.docker.internal:11434}

  worker-3:
    <<: *worker
    ports:
      - "9003:8001"
    environment:
      <<: *worker-env
      WORKER_NAME: worker-3
      WORKER_HOST: worker-3
      OLLAMA_BASE_URL: ${THUNDER_COMPUTE_URL_3:-http://host.docker.internal:11434}

  worker-4:
    <<: *worker
    ports:
      - "9004:8001"
    environment:
      <<: *worker-env
      WORKER_NAME: worker-4
      WORKER_HOST: worker-4
      OLLAMA_BASE_URL: ${THUNDER_COMPUTE_URL_4:-http://host.docker.internal:11434}

  worker-5:
    <<: *worker
    ports:
      - "9005:8001"
    environment:
      <<: *worker-env
      WORKER_NAME: worker-5
      WORKER_HOST: worker-5
      OLLAMA_BASE_URL: ${THUNDER_COMPUTE_URL_5:-http://host.docker.internal:11434}

  # ── Client ────────────────────────────────────────────────────
  client:
    profiles: [client]
    build:
      context: ./client
      dockerfile: Dockerfile
    environment:
      COORDINATOR_URL: http://control:80
      NUM_REQUESTS: ${NUM_REQUESTS:-20}
      TIMEOUT: ${TIMEOUT:-180}
    depends_on:
      control:
        condition: service_healthy
    restart: "no"
    networks:
      - llmnet

networks:
  llmnet:
    driver: bridge

volumes:
  chroma-data:
  grafana-data:
